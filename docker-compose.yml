# FDV stack: backend (NestJS) + web (React/nginx). DB ngoài qua DATABASE_URL.
# Deploy (VPS): copy .env.local cạnh file này rồi:
#   docker compose pull && docker compose up -d
# Web → http://<host>:8080 · API → http://<host>:8001/api/v1 (Swagger /api/docs)
services:
  backend:
    image: renolation/fdv-backend:latest
    container_name: fdv-backend
    # Toàn bộ secret (DATABASE_URL, JWT_*, R2_*, webhook, PORT…) đọc từ .env.local.
    env_file:
      - .env.local
    environment:
      # Đè cứng cho container production (ghi đè giá trị trùng trong .env.local).
      NODE_ENV: production
      # migrate luôn chạy lúc start; seed chỉ khi SEED_ON_START=true (idempotent)
    ports:
      - '8001:8001'
    restart: unless-stopped

  web:
    image: renolation/fdv-web:latest
    container_name: fdv-web
    # web chỉ dùng BACKEND_ORIGIN + API_BASE_URL; các biến khác trong .env.local bị bỏ qua.
    env_file:
      - .env.local
    depends_on:
      - backend
    ports:
      - '8080:80'
    restart: unless-stopped
